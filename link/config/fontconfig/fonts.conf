<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>JoyPixels</family>
  </prefer>
 </alias>
 <alias>

  <family>serif</family>
  <prefer>
   <family>JoyPixels</family>
  </prefer>
 </alias>

 <alias>
  <family>monospace</family>
  <prefer>
   <family>JoyPixels</family>
   <family>MonoLisa Variable</family>
  </prefer>
 </alias>
 <dir>~/.fonts</dir>
</fontconfig>
