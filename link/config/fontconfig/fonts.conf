<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--  Enable sub-pixel rendering --> 
  <match target="pattern">
    <!--
      This sort of configuration is available on the major desktop environments
      and we don't have to break it with "assign" unconditionally. however, we
      want to set something for others. So we use "append" here to get this working
      in both cases so that most clients would takes a look at the first place only.
    -->
    <edit name="rgba" mode="append">
      <const>rgb</const>
    </edit>
  </match>

  <!-- LCD Filter -->
  <match target="font">

    <!-- 
      Should always use LCD filtering when using ClearType subpixel rendering,
      which is enabled by default. 
    -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Sans Serif font configuration -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Switzer Variable</family>
      <family>Switzer</family>
      <family>Noto Sans</family>
      <family>JoyPixels</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
      <family>Symbola</family>
      <family>Quivira</family>
    </prefer>
  <alias>
 
  <!-- Serif font configuration -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>EB Garamond</family>
      <family>Noto Serif</family>
      <family>JoyPixels</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
      <family>Symbola</family>
      <family>Quivira</family>
    </prefer>
  </alias>
 
  <!-- Monospace font configuration -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>MonoLisa Variable</family>
      <family>Fira Code</family>
      <family>FiraCode Nerd Font</family>
      <family>JoyPixels</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
      <family>Symbola</family>
      <family>Quivira</family>
    </prefer>
  </alias>
 
  <dir>~/.fonts</dir>
</fontconfig>
